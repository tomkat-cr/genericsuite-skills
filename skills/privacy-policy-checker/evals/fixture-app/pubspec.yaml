name: mindjournal
description: A voice-first AI journaling app.
publish_to: 'none'
version: 2.3.1+41

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  # Analytics & crash reporting
  firebase_core: ^3.1.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  amplitude_flutter: ^3.16.0
  sentry_flutter: ^8.3.0
  # Monetisation
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^6.29.0
  # Device capabilities
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  record: ^5.1.0
  flutter_contacts: ^1.1.9
  # Push
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
